[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SlopScan-cli"
version = "0.1.0"
description = "A CLI tool that scans websites and codebases for patterns commonly associated with AI-generated design and code -- and shows you the evidence, not just a score."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SlopScan contributors" }]
keywords = ["cli", "static-analysis", "linter", "ai-detection", "code-quality", "design-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.4",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "respx", "ruff", "mypy"]
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/LwkMoon/SlopScan"
Issues = "https://github.com/LwkMoon/SlopScan/issues"

[project.scripts]
slopscan = "slopscan.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"slopscan.rules" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on Optional[X] / function-call default args (typer.Option(...))
# as its runtime CLI-parsing contract -- these are intentional, not bugs.
"src/SlopScan/cli/app.py" = ["UP045", "B008", "E501"]
# Rule descriptions/why-it-matters/false-positive text are human-readable
# prose, intentionally kept as single unwrapped strings for readability in
# `SlopScan rules show` -- hard-wrapping them would hurt that, not help it.
"src/SlopScan/rules/*.py" = ["E501"]
# Test assertions with long, self-explanatory literal fixtures.
"tests/*.py" = ["E501"]
# Embedded CSS template string -- wrapping mid-declaration would hurt readability.
"src/SlopScan/reports/html_report.py" = ["E501"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SlopScan (with dev dependencies)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/slopscan

      - name: Test (pytest)
        run: pytest --cov=slopscan --cov-report=term-missing

  smoke-test-cli:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: CLI sanity checks
        run: |
          slopscan --help
          slopscan version
          slopscan doctor
          slopscan rules list
          slopscan analyze tests/fixtures/generic_saas --format json
          slopscan analyze tests/fixtures/human_portfolio --format markdown
